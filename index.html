 <!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <!-- fit to screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ToDo List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            align-items: center;
        }

        h1 {
            color: rgb(18, 84, 84);
            text-align: center;
        }

        .input-section {
            display: flex;
        }
        

    </style>
</head>

<body>
    <div class= "input">
        <h1> My ToDo List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter Task"
                aria-label="New Task"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <ul id="taskList">
            <li class="empty"> No tasks. Add one above... </li>
        </ul>
    </div>
    
</body>
</html>
